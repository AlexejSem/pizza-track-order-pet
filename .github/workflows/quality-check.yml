name: Quality Check

# Trigger on pushes to any branch AND on all pull requests targeting master
on:
  push:
    branches:
      - '**'          # any branch
  pull_request:
    branches:
      - master        # or 'main' if that's your default branch
      - main

# Cancel in-progress runs for the same branch/PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------- Job 1: ESLint --------
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'          # match your project's Node version
          cache: 'npm'                # or 'yarn' / 'pnpm'

      - name: Install dependencies
        run: npm ci                   # use `yarn install --frozen-lockfile` or `pnpm install --frozen-lockfile`

      - name: Run ESLint
        run: npx eslint . --max-warnings=0

  # -------- Job 2: TypeScript --------
  type-check:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit